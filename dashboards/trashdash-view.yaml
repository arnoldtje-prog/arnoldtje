    entity: input_boolean.bevestig_rolluik_open
    icon: mdi:motion-sensor
    name: Beweging zolder
    show_icon: true
    show_name: true
    show_state: false
    state:
      - styles:
          card:
            - display: none
        value: 'off'
    styles:
      card:
        - width: 220px
        - height: 42px
        - padding: 6px 12px
        - background: '#ffffff'
        - border: '1px solid #dddddd'
        - border-radius: 8px
        - box-shadow: 0 2px 8px rgba(0,0,0,0.18)
        - cursor: pointer
      grid:
        - grid-template-areas: '"i n"'
        - grid-template-columns: 28px 1fr
        - column-gap: 8px
      icon:
        - width: 20px
        - color: '#4caf50'
      name:
        - justify-self: start
        - font-size: 13px
        - font-weight: 600
        - color: '#222222'
    tap_action:
      action: perform-action
      perform_action: script.bevestig_open_rolluik
    type: custom:button-card
  - type: custom:button-card
    entity: conversation.home_assistant
    show_name: false
    show_state: false
    icon: mdi:microphone
    tap_action:
      action: assist
    custom_fields:
      glow: |
        <div class="glass-glow"
             onmousemove="
               const r=this.getBoundingClientRect();
               this.style.setProperty('--mx', (event.clientX-r.left)+'px');
               this.style.setProperty('--my', (event.clientY-r.top)+'px');
             ">
        </div>
    styles:
      card:
        - width: 3cm
        - height: 1cm
        - border-radius: 10px
        - background: rgba(255,255,255,0.12)
        - backdrop-filter: blur(14px)
        - -webkit-backdrop-filter: blur(14px)
        - border: 1px solid rgba(255,255,255,0.35)
        - box-shadow: 0 4px 16px rgba(0,0,0,0.25), inset 0 1px 1px rgba(255,255,255,0.4)
        - transition: >-
            transform 0.25s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.25s
            ease
        - position: relative
        - overflow: hidden
        - display: flex
        - align-items: center
        - justify-content: center
      icon:
        - color: white
        - '--mdc-icon-size: 22px'
      custom_fields:
        glow:
          - position: absolute
          - inset: 0
          - background: >
              radial-gradient(circle at var(--mx,50%) var(--my,50%),
              rgba(255,255,255,0.35), transparent 60%)
          - opacity: 0
          - transition: opacity 0.2s ease
    extra_styles: |
      ha-card:hover {
        transform: scale(1.08);
        box-shadow: 0 6px 20px rgba(0,0,0,0.3), inset 0 1px 1px rgba(255,255,255,0.5);
      }
      ha-card:hover .glass-glow {
        opacity: 1;
