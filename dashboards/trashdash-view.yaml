        icon: mdi:air-conditioner
        label: Airco
        popup:
          - icon: mdi:sofa
            label: Woonkamer
            url: airco
          - icon: mdi:bed
            label: Kamer
            url: aircoslaapkamer
          - icon: mdi:home-roof
            label: Zolder
            url: aircozolder
        tap_action:
          action: open-popup
        url: '#'
      - class_name: |-
          [[[
            const p = window.location.pathname;
            return (
              p.includes('jose-dashboard') ||
              p.includes('TrashdashhPapi') ||
              p.includes('ruben-dashboard')
            ) ? 'sub-active' : '';
          ]]]
        hold_action:
          action: open-popup
        icon: mdi:account
        label: Account
        popup:
          - icon: mdi:heart
            label: Woonkamer (Hartje)
            url: jose-dashboard
          - icon: mdi:tennis
            label: Kamer (Racket)
            url: TrashdashhPapi
          - icon: mdi:soccer
            label: Zolder (Voetbal)
            url: ruben-dashboard
        tap_action:
          action: open-popup
        url: '#'
      - icon: mdi:chart-line
        label: Statistieken
        url: statistieken
    styles: |
      :host {
        --navbar-route-icon-color: #333333 !important;
        --navbar-route-icon-color-active: #808080 !important;
        --primary-color: #808080 !important;
        --accent-color: #808080 !important;
      }

      /* =========================================================
         BASIS
         ========================================================= */

      .navbar {
        --navbar-background-color: transparent !important;
        --navbar-border-radius: 24px;
        --navbar-route-icon-size: 25px;
        --navbar-box-shadow-desktop: none;
        --mdc-icon-size: 25px;

        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
      }

      /* =========================================================
         DESKTOP NAVBAR
         ========================================================= */

      .navbar.desktop.left {
        width: 84px !important;
        height: auto !important;

        left: 80px !important;
        top: 50% !important;
        bottom: auto !important;

        transform: translateY(-50%) !important;

        padding: 10px 0 !important;

        position: relative !important;

        background: transparent !important;
        border: none !important;
        border-radius: 24px !important;

        box-shadow: none !important;

        overflow: visible !important;
      }

      /* Desktop glaslaag */

      .navbar.desktop.left::before {
        content: "";
        position: absolute;

        inset: 0;

        border-radius: 24px;

        padding: 1px;

        background:
          linear-gradient(
            135deg,
            rgba(255,255,255,0.00) 0%,
            rgba(255,255,255,0.10) 22%,
            rgba(255,255,255,0.28) 50%,
            rgba(255,255,255,0.10) 78%,
            rgba(255,255,255,0.00) 100%
          );

        -webkit-mask:
          linear-gradient(#fff 0 0) content-box,
          linear-gradient(#fff 0 0);

        -webkit-mask-composite: xor;
        mask-composite: exclude;

        pointer-events: none;

        z-index: 3;
      }

      .navbar.desktop.left::after {
        content: "";

        position: absolute;

        inset: 0;

        border-radius: 24px;

        background:
          linear-gradient(
            180deg,
            rgba(255,255,255,0.14) 0%,
            rgba(255,255,255,0.06) 45%,
            rgba(255,255,255,0.025) 100%
          );

        backdrop-filter:
          blur(10px)
          saturate(120%);

        -webkit-backdrop-filter:
          blur(10px)
          saturate(120%);

        box-shadow:
          inset 0 1px 1px rgba(255,255,255,0.18),
          inset 0 -1px 1px rgba(0,0,0,0.04),
          inset -6px 8px 16px rgba(0,0,0,0.045),
          0 8px 24px rgba(0,0,0,0.10);

        pointer-events: none;

        z-index: -1;
      }

      /* =========================================================
         MOBILE NAVBAR
         ========================================================= */

      .navbar.mobile {
        position: relative !important;

        background: transparent !important;
        border: none !important;
        box-shadow: none !important;

        border-radius: 26px !important;

        overflow: visible !important;
      }

      .navbar.mobile::before {
        content: "";

        position: absolute;

        inset: 0;

        border-radius: 26px;

        padding: 1px;

        background:
          linear-gradient(
            135deg,
            rgba(255,255,255,0.00) 0%,
            rgba(255,255,255,0.10) 22%,
            rgba(255,255,255,0.28) 50%,
            rgba(255,255,255,0.10) 78%,
            rgba(255,255,255,0.00) 100%
          );

        -webkit-mask:
          linear-gradient(#fff 0 0) content-box,
          linear-gradient(#fff 0 0);

        -webkit-mask-composite: xor;
        mask-composite: exclude;

        pointer-events: none;

        z-index: 3;
      }

      .navbar.mobile::after {
        content: "";

        position: absolute;

        inset: 0;

        border-radius: 26px;

        background:
          linear-gradient(
            180deg,
            rgba(255,255,255,0.14) 0%,
            rgba(255,255,255,0.06) 45%,
            rgba(255,255,255,0.025) 100%
          );

        backdrop-filter:
          blur(10px)
          saturate(120%);

        -webkit-backdrop-filter:
          blur(10px)
          saturate(120%);

        box-shadow:
          inset 0 1px 1px rgba(255,255,255,0.18),
          inset 0 -1px 1px rgba(0,0,0,0.04),
          inset -6px 8px 16px rgba(0,0,0,0.045),
          0 8px 24px rgba(0,0,0,0.10);

        pointer-events: none;

        z-index: -1;
      }

      /* =========================================================
         ROUTES
         ========================================================= */

      .route {
        width: 100% !important;

        display: flex !important;

        justify-content: center !important;
        align-items: center !important;

        padding: 6px 10px !important;

        position: relative !important;

        z-index: 5 !important;
      }

      /* =========================================================
         ALLE KNOPPEN
         ========================================================= */

      .button {
        width: 60px !important;
        height: 60px !important;

        border-radius: 21px !important;

        background: transparent !important;

        border: 1px solid transparent !important;

        display: flex !important;

        align-items: center !important;
        justify-content: center !important;

        position: relative !important;

        transition:
          background 0.22s ease,
          border 0.22s ease,
          box-shadow 0.22s ease,
          transform 0.22s ease,
          backdrop-filter 0.22s ease !important;
      }

      /* =========================================================
         HOVER
         ========================================================= */

      .button:hover {
        background:
          linear-gradient(
            135deg,
            rgba(255,255,255,0.17),
            rgba(255,255,255,0.055)
          ) !important;

        border:
          1px solid rgba(255,255,255,0.20) !important;

        backdrop-filter:
          blur(9px)
          saturate(125%) !important;

        -webkit-backdrop-filter:
          blur(9px)
          saturate(125%) !important;

        box-shadow:
          inset 0 1px 1px rgba(255,255,255,0.22),
          inset -3px -3px 8px rgba(0,0,0,0.025),
          0 5px 18px rgba(255,255,255,0.10),
          0 4px 12px rgba(0,0,0,0.10) !important;

        transform:
          scale(1.045) !important;
      }

      /* =========================================================
         ACTIEVE KNOP
         ========================================================= */

      .button.active,
      .route.active .button,
      .popup-item.active .button,
      .submenu .button.active,
      .sub-active .button,
      .sub-active {
        background:
          linear-gradient(
            135deg,
            rgba(255,255,255,0.19),
            rgba(255,255,255,0.065)
          ) !important;

        border:
          1px solid rgba(255,255,255,0.26) !important;

        backdrop-filter:
          blur(10px)
          saturate(125%) !important;

        -webkit-backdrop-filter:
          blur(10px)
          saturate(125%) !important;

        box-shadow:
          inset 0 1px 1px rgba(255,255,255,0.23),
          inset -3px -3px 8px rgba(0,0,0,0.025),
          0 5px 18px rgba(255,255,255,0.12),
          0 4px 12px rgba(0,0,0,0.11) !important;

        transform:
          scale(1.045) !important;
      }

      /* =========================================================
         ICONEN
         ========================================================= */

      .icon,
      ha-icon,
      ha-state-icon,
      ha-icon path {
        color: #333333 !important;
        fill: #333333 !important;

        transition:
          color 0.2s ease,
          fill 0.2s ease,
          filter 0.2s ease !important;
      }

      /* Actieve iconen */

      .button.active .icon,
      .button.active ha-icon,
      .button.active ha-icon path,

      .route.active .icon,
      .route.active ha-icon,
      .route.active ha-icon path,

      .sub-active .icon,
      .sub-active ha-icon,
      .sub-active ha-icon path,

      .popup-item.active .icon,
      .popup-item.active ha-icon,
      .popup-item.active ha-icon path,

      .submenu .button.active .icon,
      .submenu .button.active ha-icon,
      .submenu .button.active ha-icon path {
        color: #808080 !important;
        fill: #808080 !important;
      }

      /* =========================================================
         POPUP / SUBMENU BASIS
         ========================================================= */

      .submenu,
      .popup {
        background: transparent !important;

        border: none !important;

        box-shadow: none !important;

        border-radius: 22px !important;

        padding: 7px !important;

        position: relative !important;

        overflow: visible !important;
      }

      /* Popup rand */

      .submenu::before,
      .popup::before {
        content: "";

        position: absolute;

        inset: 0;

        border-radius: 22px;

        padding: 1px;

        background:
          linear-gradient(
            135deg,
            rgba(255,255,255,0.00) 0%,
            rgba(255,255,255,0.12) 25%,
            rgba(255,255,255,0.30) 50%,
            rgba(255,255,255,0.10) 75%,
            rgba(255,255,255,0.00) 100%
          );

        -webkit-mask:
          linear-gradient(#fff 0 0) content-box,
          linear-gradient(#fff 0 0);

        -webkit-mask-composite: xor;
        mask-composite: exclude;

        pointer-events: none;

        z-index: 3;
      }

      /* Popup glas */

      .submenu::after,
      .popup::after {
        content: "";

        position: absolute;

        inset: 0;

        border-radius: 22px;

        background:
          linear-gradient(
            180deg,
            rgba(255,255,255,0.16) 0%,
            rgba(255,255,255,0.065) 45%,
            rgba(255,255,255,0.025) 100%
          );

        backdrop-filter:
          blur(10px)
          saturate(120%);

        -webkit-backdrop-filter:
          blur(10px)
          saturate(120%);

        box-shadow:
          inset 0 1px 1px rgba(255,255,255,0.20),
          inset -6px 8px 16px rgba(0,0,0,0.045),
          0 8px 24px rgba(0,0,0,0.12);

        pointer-events: none;

        z-index: -1;
      }

      /* =========================================================
         POPUP ITEMS
         ========================================================= */

      .popup-item,
      .submenu .route {
        position: relative !important;

        z-index: 5 !important;
      }

      .popup-item .button,
      .submenu .button {
        border-radius: 18px !important;

        background: transparent !important;

        border: 1px solid transparent !important;

        transition:
          background 0.22s ease,
          border 0.22s ease,
          box-shadow 0.22s ease,
          transform 0.22s ease !important;
      }

      /* Normale popup knop */

      .popup-item:not(.active) .button,
      .submenu .button:not(.active) {
        background:
          rgba(255,255,255,0.025) !important;

        color:
          rgba(150,150,150,0.95) !important;
      }

      /* Popup hover */

      .popup-item:not(.active) .button:hover,
      .submenu .button:not(.active):hover {
        background:
          linear-gradient(
            135deg,
            rgba(255,255,255,0.18),
            rgba(255,255,255,0.065)
          ) !important;

        border:
          1px solid rgba(255,255,255,0.20) !important;

        backdrop-filter:
          blur(8px)
          saturate(120%) !important;

        -webkit-backdrop-filter:
          blur(8px)
          saturate(120%) !important;

        box-shadow:
          inset 0 1px 1px rgba(255,255,255,0.20),
          0 5px 18px rgba(255,255,255,0.10),
          0 3px 10px rgba(0,0,0,0.09) !important;

        transform:
          scale(1.035) !important;
      }

      /* =========================================================
         POPUP TEKST
         ========================================================= */

      .popup-item:not(.active) .label,
      .submenu .button:not(.active) .label,
      .submenu .route .label {
        color:
          rgba(150,150,150,0.92) !important;
      }

      .popup-item.active .label,
      .popup-item.active .name,

      .submenu .button.active .label,
      .submenu .button.active .name {
        color:
          #ffffff !important;
      }

      /* =========================================================
         MOBILE LABELS
         ========================================================= */

      .navbar.mobile .label {
        color:
          rgba(80,80,80,0.95) !important;
      }

      .navbar.mobile .route.active .label,
      .navbar.mobile .sub-active .label {
        color:
          #808080 !important;
      }
    type: custom:navbar-card
header:
  badges_position: top
  badges_wrap: wrap
  layout: start
icon: mdi:linux
max_columns: 4
path: Trashdashh
sections:
  - cards:
      - card_mod:
          style: |-
            :host {
              display: block;
              position: relative;
              width: 100%;
              border-radius: 26px;
              cursor: pointer;
              transition: transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .25s ease;
            }
            :host:hover {
              transform: translateY(-4px);
            }
            :host::before {
              content: "";
              position: absolute;
              inset: 0;
              border-radius: 26px;
              padding: .1rem;
              background: linear-gradient(60deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.2) 49%, rgba(255,255,255,.2) 51%, rgba(255,255,255,0) 100%);
              -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
              -webkit-mask-composite: xor;
              mask-composite: exclude;
              filter: saturate(130%);
              pointer-events: none;
              transition: opacity .25s ease;
            }
